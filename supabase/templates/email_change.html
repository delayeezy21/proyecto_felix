<!doctype html>
<html lang="es">
<body style="margin:0;padding:24px;background:#f4f7f6;font-family:Arial,Helvetica,sans-serif;color:#1d2a27;">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;padding:28px;">
    <h1 style="font-size:20px;color:#1f5f52;margin:0 0 16px;">Felix &middot; Confirma tu nuevo correo</h1>
    <p style="font-size:15px;line-height:1.5;">Pediste cambiar el correo de tu cuenta de {{ .Email }} a {{ .NewEmail }}.</p>
    <p style="margin:24px 0;">
      <a href="{{ .ConfirmationURL }}"
         style="background:#1f5f52;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:bold;">Confirmar el cambio</a>
    </p>
    <p style="font-size:13px;color:#5b6b67;line-height:1.5;">Si el botón no funciona, copia este enlace en tu navegador:<br>{{ .ConfirmationURL }}</p>
    <p style="font-size:13px;color:#5b6b67;line-height:1.5;">Si no lo pediste, ignora este mensaje y escríbenos.</p>
  </div>
</body>
</html>
